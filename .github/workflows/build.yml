name: Build PZY MOVE HORRE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'PZY_MOVE_HORRE_*_Source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Fabric 1.21.1 mod
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # Extract the project BEFORE setup-java scans for Gradle files.
      - name: Extract PZY source ZIP safely
        id: src
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import os, re, stat

          # Use the newest PZY_MOVE_HORRE_<version>_Source.zip in the repository root.
          def ver_key(p):
              m = re.fullmatch(r"PZY_MOVE_HORRE_(\d+(?:\.\d+)*)_Source\.zip", p.name)
              return tuple(int(x) for x in m.group(1).split(".")) if m else None
          found = [p for p in Path(".").glob("PZY_MOVE_HORRE_*_Source.zip") if ver_key(p)]
          if not found:
              raise SystemExit("No PZY_MOVE_HORRE_<version>_Source.zip at repository root")
          archive = max(found, key=ver_key)
          version = ".".join(str(x) for x in ver_key(archive))
          print(f"Using {archive} (version {version})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
          destination = Path("project")
          if not archive.is_file() or archive.stat().st_size == 0:
              raise SystemExit("Source ZIP is missing or empty at repository root")
          destination.mkdir(parents=True, exist_ok=True)
          root = destination.resolve()
          with ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP entry: {bad}")
              for info in zf.infolist():
                  name = PurePosixPath(info.filename)
                  if name.is_absolute() or ".." in name.parts:
                      raise SystemExit(f"Unsafe ZIP path: {info.filename}")
                  mode = (info.external_attr >> 16) & 0o170000
                  if mode == stat.S_IFLNK:
                      raise SystemExit(f"Symbolic links are not allowed: {info.filename}")
              zf.extractall(destination)

          candidates = [destination] if (destination / "settings.gradle").is_file() else [
              p.parent for p in destination.rglob("settings.gradle")
          ]
          candidates = [p for p in candidates if (p / "build.gradle").is_file()]
          if len(candidates) != 1:
              raise SystemExit(f"Expected one Gradle project, found {len(candidates)}")
          project_dir = candidates[0].resolve()
          if not project_dir.is_relative_to(root):
              raise SystemExit("Gradle project resolved outside extraction directory")
          required = [
              project_dir / "src/main/resources/fabric.mod.json",
              project_dir / "src/main/resources/pzy_move_horre.mixins.json",
              project_dir / "src/main/java/pzy/move/horre/PzyMoveHorreClient.java",
          ]
          for path in required:
              if not path.is_file():
                  raise SystemExit(f"Required source file missing: {path.relative_to(project_dir)}")
          Path("project_dir.txt").write_text(str(project_dir), encoding="utf-8")
          print(f"Prepared source project: {project_dir}")
          PY

      # Gradle files now exist, so setup-java's Gradle cache scan can succeed.
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: project/**/gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Build and remap PZY mod
        shell: bash
        run: |
          PROJECT_DIR="$(cat project_dir.txt)"
          gradle --no-daemon --console=plain -p "$PROJECT_DIR" clean build

      - name: Verify installable JAR
        shell: bash
        env:
          PZY_VERSION: ${{ steps.src.outputs.version }}
        run: |
          PROJECT_DIR="$(cat project_dir.txt)"
          JAR="$PROJECT_DIR/build/libs/pzy_move_horre-${PZY_VERSION}.jar"
          test -s "$JAR"
          python - "$JAR" "$PZY_VERSION" <<'PY'
          import json
          import sys
          from zipfile import ZipFile

          jar_path = sys.argv[1]
          expected_version = sys.argv[2]
          with ZipFile(jar_path) as zf:
              names = set(zf.namelist())
              required = {
                  "fabric.mod.json",
                  "pzy_move_horre.mixins.json",
                  "pzy_move_horre.refmap.json",
                  "assets/pzy_move_horre/icon.png",
                  "pzy/move/horre/PzyMoveHorreClient.class",
                  "pzy/move/horre/render/PzyHandRenderer.class",
                  "pzy/move/horre/gui/PzyConfigScreen.class",
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit("JAR is missing required entries:\n" + "\n".join(missing))
              metadata = json.loads(zf.read("fabric.mod.json"))
              if metadata.get("id") != "pzy_move_horre" or metadata.get("version") != expected_version:
                  raise SystemExit("Unexpected mod id or version in fabric.mod.json")
          print(f"Verified PZY MOVE HORRE {expected_version} installable JAR")
          PY

      - name: Upload one installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: PZY-MOVE-HORRE-${{ steps.src.outputs.version }}-Fabric-1.21.1
          path: project/**/build/libs/pzy_move_horre-${{ steps.src.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 30
